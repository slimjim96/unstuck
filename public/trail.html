<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstuck — Trail</title>
<script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 8vh; }
  #count { font-size: 3.4rem; font-weight: 700; line-height: 1.1; color: var(--accent); }
  #count-sub { color: var(--muted); margin-bottom: 3rem; }
  .day { margin-bottom: 1.6rem; }
  .day h2 {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); font-weight: 600; margin: 0 0 0.5rem;
  }
  .day .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline;
  }
  .day .item .tick { color: var(--accent); font-weight: 700; }
  .day .item .min { color: var(--muted); font-size: 0.82rem; margin-left: auto; white-space: nowrap; }
  #quiet { color: var(--muted); font-size: 0.88rem; margin-top: 3rem; }
  #empty { display: none; }
  #empty.show { display: block; }
  #empty a { color: var(--accent); }
  body.is-empty #count, body.is-empty #count-sub { display: none; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Unstuck — Trail</h1>
  <nav data-nav></nav>
</div>

<main>
  <div id="count"></div>
  <div id="count-sub"></div>
  <div id="days"></div>
  <div id="empty">
    <p>No ✓ yet — that's fine.</p>
    <p>The first tiny step you finish lands here, and stays.
       <a href="/">Make something smaller on the Map</a>.</p>
  </div>
  <p id="quiet">Only what happened. No streaks, no gaps, no guilt.</p>
</main>

<script>
  const sampleParam = new URLSearchParams(location.search).get("sample");

  function fromElements(elements) {
    const nodes = [];
    for (const el of elements) {
      const d = el.data || {};
      if (!d.source && d.id)
        nodes.push({ id: d.id, label: d.label || d.id, minutes: d.minutes,
                     status: d.status || "open", doneAt: d.doneAt });
    }
    return nodes;
  }

  async function loadData() {
    if (sampleParam) {
      const res = await fetch("/samples/" + sampleParam + ".json");
      if (res.ok) return (await res.json()).graph.nodes;
    }
    return fromElements(await Unstuck.loadGraph());
  }

  function dayLabel(iso) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
    const diff = Math.round((today - d) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  let nodes = [];

  function render() {
    const done = nodes.filter((n) => n.status === "done");
    document.body.classList.toggle("is-empty", done.length === 0);
    document.getElementById("empty").classList.toggle("show", done.length === 0);
    if (!done.length) { document.getElementById("days").innerHTML = ""; return; }

    document.getElementById("count").textContent = done.length;
    const dates = done.map((n) => n.doneAt && n.doneAt.slice(0, 10)).filter(Boolean).sort();
    document.getElementById("count-sub").textContent =
      "tiny step" + (done.length === 1 ? "" : "s") + " done" +
      (dates.length ? " since " + dayLabel(dates[0]).toLowerCase() : "");

    // group by day, newest first; pre-timestamp dones go in an "earlier" group
    const groups = new Map();
    for (const n of done) {
      const key = n.doneAt ? n.doneAt.slice(0, 10) : "";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(n);
    }
    const keys = [...groups.keys()].sort().reverse(); // "" (earlier) lands last

    const days = document.getElementById("days");
    days.innerHTML = "";
    for (const key of keys) {
      const day = document.createElement("div");
      day.className = "day";
      const h = document.createElement("h2");
      h.textContent = key ? dayLabel(key) : "Earlier";
      day.appendChild(h);
      for (const n of groups.get(key)) {
        const item = document.createElement("div");
        item.className = "item";
        const tick = document.createElement("span");
        tick.className = "tick"; tick.textContent = "✓";
        const label = document.createElement("span");
        label.textContent = n.label;
        item.appendChild(tick); item.appendChild(label);
        if (n.minutes) {
          const min = document.createElement("span");
          min.className = "min"; min.textContent = "~" + n.minutes + " min";
          item.appendChild(min);
        }
        day.appendChild(item);
      }
      days.appendChild(day);
    }
  }

  if (!sampleParam) {
    Unstuck.onGraphChange(async () => {
      nodes = fromElements(await Unstuck.loadGraph());
      render();
    });
  }

  loadData().then((n) => { nodes = n; render(); });
</script>
</body>
</html>
