<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstuck</title>
<style>
  :root {
    --bg: #10141a;
    --card: #1a212b;
    --ink: #e8ecf1;
    --muted: #8b97a5;
    --accent: #4fc3a1;
    --accent-soft: rgba(79, 195, 161, 0.12);
    --warn: #d9a05b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: min(640px, 92vw); padding: 9vh 0 6vh; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.01em; margin: 0 0 0.3rem; }
  .tagline { color: var(--muted); margin: 0 0 2.2rem; font-size: 0.95rem; }

  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    background: var(--card);
    color: var(--ink);
    border: 1px solid #2a3442;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  button {
    font: inherit;
    font-size: 0.95rem;
    border: 0;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #0c1116;
    font-weight: 600;
  }
  button.secondary { background: #2a3442; color: var(--ink); font-weight: 400; }
  button:disabled { opacity: 0.45; cursor: wait; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .card {
    background: var(--card);
    border: 1px solid #2a3442;
    border-radius: 14px;
    padding: 22px 24px;
    margin-top: 1.6rem;
    animation: rise 0.35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card .label {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--accent); margin-bottom: 0.5rem;
  }
  .card.question .label { color: var(--warn); }
  .card p { margin: 0; }
  .not-today {
    margin-top: 0.9rem; padding: 10px 14px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-size: 0.92rem;
  }
  .error { color: #e07a7a; margin-top: 1rem; font-size: 0.92rem; }
  .hidden { display: none; }
  .quiet { color: var(--muted); font-size: 0.9rem; margin-top: 2.5rem; }
</style>
</head>
<body>
<main>
  <h1>Unstuck</h1>
  <p class="tagline">Tell it the thing you keep avoiding. Get back one tiny step.</p>

  <section id="capture">
    <textarea id="stuck" placeholder="I keep meaning to deal with…" autofocus></textarea>
    <div class="row">
      <button id="go">Make it smaller</button>
    </div>
  </section>

  <section id="step" class="hidden">
    <div class="card" id="card">
      <div class="label" id="card-label"></div>
      <p id="card-text"></p>
      <div class="not-today hidden" id="not-today"></div>
    </div>

    <div class="row hidden" id="action-buttons">
      <button id="did-it">I did it</button>
      <button class="secondary" id="too-big">Still too big</button>
      <button class="secondary" id="start-over">Different thing</button>
    </div>

    <div class="hidden" id="answer-area">
      <div class="row">
        <textarea id="answer" rows="2" placeholder="Your answer…" style="min-height:54px"></textarea>
      </div>
      <div class="row">
        <button id="send-answer">Answer</button>
        <button class="secondary" id="use-default"></button>
      </div>
    </div>

    <div class="row hidden" id="message-buttons">
      <button id="next-one">Give me the next tiny step</button>
      <button class="secondary" id="done-for-now">Done for now</button>
    </div>
  </section>

  <p class="error hidden" id="error"></p>
  <p class="quiet">One thing at a time. No streaks, no guilt.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let messages = [];
  let busy = false;

  function show(el, on = true) { el.classList.toggle("hidden", !on); }

  function setBusy(on) {
    busy = on;
    document.querySelectorAll("button").forEach((b) => (b.disabled = on));
  }

  async function send(userText) {
    messages.push({ role: "user", content: userText });
    setBusy(true);
    show($("error"), false);
    try {
      const res = await fetch("/api/next-step", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const step = await res.json();
      if (!res.ok) throw new Error(step.error || "Something went wrong.");
      messages.push({ role: "assistant", content: JSON.stringify(step) });
      render(step);
    } catch (err) {
      // keep the failed turn out of history so retry is clean
      messages.pop();
      $("error").textContent = err.message;
      show($("error"));
    } finally {
      setBusy(false);
    }
  }

  function render(step) {
    show($("capture"), false);
    show($("step"));
    show($("action-buttons"), false);
    show($("answer-area"), false);
    show($("message-buttons"), false);
    show($("not-today"), false);

    const card = $("card");
    card.className = "card " + step.kind;
    $("card-text").textContent = step.text;

    if (step.kind === "action") {
      $("card-label").textContent = "Your one tiny step";
      if (step.not_today) {
        $("not-today").textContent = step.not_today;
        show($("not-today"));
      }
      show($("action-buttons"));
    } else if (step.kind === "question") {
      $("card-label").textContent = "Quick question";
      $("answer").value = "";
      $("use-default").textContent = step.default
        ? "I don't know — " + step.default
        : "I don't know, you pick";
      show($("answer-area"));
    } else {
      $("card-label").textContent = "Unstuck";
      show($("message-buttons"));
    }
  }

  function reset() {
    messages = [];
    $("stuck").value = "";
    show($("step"), false);
    show($("capture"));
    $("stuck").focus();
  }

  $("go").addEventListener("click", () => {
    const text = $("stuck").value.trim();
    if (text && !busy) send("I'm stuck on this: " + text);
  });
  $("stuck").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("go").click();
  });

  $("did-it").addEventListener("click", () => send("I did it."));
  $("too-big").addEventListener("click", () =>
    send("That's still too big. Split it smaller."));
  $("start-over").addEventListener("click", reset);

  $("send-answer").addEventListener("click", () => {
    const a = $("answer").value.trim();
    if (a && !busy) send(a);
  });
  $("use-default").addEventListener("click", () =>
    send("I don't know — go with your default."));

  $("next-one").addEventListener("click", () =>
    send("Give me the next tiny step."));
  $("done-for-now").addEventListener("click", reset);
</script>
</body>
</html>
