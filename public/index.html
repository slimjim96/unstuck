<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstuck — Map</title>
<script src="/assets/app.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex;
  }

  #cy { flex: 1; min-width: 0; }

  .topbar > button { padding: 5px 12px; font-size: 0.8rem; }
  .topbar select {
    background: var(--line); color: var(--ink); border: 0; border-radius: 8px;
    padding: 5px 8px; font: inherit; font-size: 0.8rem; cursor: pointer;
  }

  #legend {
    position: absolute; bottom: 14px; left: 16px; z-index: 5;
    color: var(--muted); font-size: 0.78rem; display: flex; gap: 14px;
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  #panel {
    width: 340px; flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; max-width: 95%; }
  .msg.user { color: var(--muted); }
  .msg.ai {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px;
  }
  .msg.err { color: #e07a7a; font-size: 0.88rem; }

  #node-box {
    border-top: 1px solid var(--line); padding: 12px 16px; display: none;
  }
  #node-box.show { display: block; }
  #node-label { font-weight: 600; margin-bottom: 2px; }
  #node-meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
  #node-box .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #node-box .fields { margin-bottom: 8px; }
  #node-box .field {
    display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 90px;
    color: var(--muted); font-size: 0.75rem;
  }
  #node-box input, #node-box select, #node-box textarea {
    width: 100%; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
    font: inherit; font-size: 0.85rem; resize: vertical;
  }
  #node-box :is(input, select, textarea):focus { border-color: var(--accent); outline: none; }

  #composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  #composer textarea {
    width: 100%; min-height: 60px; resize: vertical;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; outline: none;
  }
  #composer textarea:focus { border-color: var(--accent); }
  #composer .row { display: flex; gap: 8px; margin-top: 8px; }

  button {
    font: inherit; font-size: 0.88rem; border: 0; border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
    background: var(--accent); color: #0c1116; font-weight: 600;
  }
  html.light button:not(.secondary):not(.danger) { color: #fff; }
  button.secondary { background: var(--line); color: var(--ink); font-weight: 400; }
  button.danger { background: transparent; color: var(--stuck); font-weight: 400; }
  button:disabled { opacity: 0.45; cursor: wait; }
</style>
</head>
<body>
<div id="cy"></div>

<div class="topbar">
  <h1>Unstuck — Map</h1>
  <button class="secondary" id="arrange">Auto-arrange</button>
  <button class="secondary" id="clear">Clear map</button>
  <select id="sample">
    <option value="">Load sample…</option>
    <option value="learn-ai">Learning AI/ML</option>
    <option value="ship-app">Shipping a side project</option>
    <option value="build-shed">Building a shed</option>
  </select>
  <nav data-nav></nav>
</div>

<div id="legend">
  <span><span class="dot" style="background:var(--stuck)"></span>stuck</span>
  <span><span class="dot" style="background:var(--accent)"></span>step-based</span>
  <span><span class="dot" style="background:var(--time)"></span>time-based</span>
  <span><span class="dot" style="background:var(--mixed)"></span>mixed</span>
  <span>dashed = blocks</span>
</div>

<aside id="panel">
  <div id="chat">
    <div class="msg ai">Dump something you keep avoiding — or several things. I'll map them, and you can drag, rewire, and delete anything I put down.</div>
  </div>

  <div id="node-box">
    <div class="row fields">
      <label class="field">Title
        <input type="text" id="node-title">
      </label>
    </div>
    <div class="row fields">
      <label class="field">Detail
        <textarea id="node-detail" rows="2" placeholder="optional"></textarea>
      </label>
    </div>
    <div class="row fields">
      <label class="field">When
        <input type="date" id="node-when">
      </label>
      <label class="field">Minutes
        <input type="number" id="node-minutes" min="1" placeholder="—">
      </label>
    </div>
    <div class="row fields">
      <label class="field">Type
        <select id="node-type">
          <option value="stuck">stuck</option>
          <option value="task">task</option>
          <option value="step">step</option>
          <option value="event">event</option>
        </select>
      </label>
      <label class="field">Mode
        <select id="node-mode">
          <option value="step">step-based</option>
          <option value="time">time-based</option>
          <option value="mixed">mixed</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button id="split">Split smaller</button>
      <button class="secondary" id="toggle-done">Done</button>
      <button class="danger" id="delete">Delete</button>
    </div>
  </div>

  <div id="composer">
    <textarea id="input" placeholder="I keep meaning to… (Ctrl+Enter to send)"></textarea>
    <div class="row">
      <button id="send">Send</button>
      <button class="secondary" id="add-node">+ Add node myself</button>
    </div>
  </div>
</aside>

<script>
  const $ = (id) => document.getElementById(id);
  let messages = JSON.parse(localStorage.getItem("unstuck.messages") || "[]");
  let busy = false;
  let selected = null;

  // canvas colors come from the shared palette (assets/app.js); the style
  // functions read it lazily so a theme change only needs cy.style().update()
  const P = () => Unstuck.palette();

  const cy = cytoscape({
    container: $("cy"),
    elements: [], // server-canonical since Phase 2 — loaded just below
    wheelSensitivity: 0.25,
    style: [
      { selector: "node", style: {
          "background-color": (n) => n.data("type") === "stuck" ? P().stuck : (P()[n.data("mode")] || P().plain),
          "label": "data(label)",
          "color": () => P().ink,
          "font-size": 11,
          "text-wrap": "wrap",
          "text-max-width": 110,
          "text-valign": "bottom",
          "text-margin-y": 6,
          "width": (n) => n.data("type") === "stuck" || n.data("type") === "task" ? 34 : 22,
          "height": (n) => n.data("type") === "stuck" || n.data("type") === "task" ? 34 : 22,
          "border-width": 0,
        } },
      { selector: "node[status = 'done']", style: { "opacity": 0.35, "label": (n) => "✓ " + n.data("label") } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": () => P().ink } },
      { selector: "edge", style: {
          "width": 1.5, "line-color": () => P().edge, "curve-style": "bezier",
          "target-arrow-shape": "none",
        } },
      { selector: "edge[kind = 'blocks']", style: {
          "line-style": "dashed", "line-color": () => P().time,
          "target-arrow-shape": "triangle", "target-arrow-color": () => P().time,
        } },
      { selector: "edge[kind = 'related']", style: { "line-style": "dotted", "line-color": () => P().related } },
    ],
  });

  // ---- persistence ----
  // The graph lives on the server (one write path: ops). Only the chat
  // panel's conversation stays client-side.
  function save() {
    localStorage.setItem("unstuck.messages", JSON.stringify(messages));
  }

  Unstuck.loadGraph().then((els) => { cy.add(els); });

  // another client (tab or device) changed the graph — refetch and re-render
  Unstuck.onGraphChange(async () => {
    const res = await fetch("/api/graph");
    const fresh = (await res.json()).elements;
    const selId = selected && selected.id();
    cy.elements().remove();
    cy.add(fresh);
    if (selId && cy.getElementById(selId).length) showNodeBox(cy.getElementById(selId));
    else hideNodeBox();
  });

  // ---- chat panel ----
  function addMsg(kind, text) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    $("chat").appendChild(div);
    $("chat").scrollTop = $("chat").scrollHeight;
  }

  function setBusy(on) {
    busy = on;
    document.querySelectorAll("button").forEach((b) => (b.disabled = on));
  }

  // ---- applying model operations ----
  function placeNear(id, ops) {
    // place a new node near its parent (part_of target in same batch) or near center
    const partOf = ops.find((o) => o.op === "add_edge" && o.kind === "part_of" && o.source === id);
    const anchor = partOf && cy.getElementById(partOf.target).length
      ? cy.getElementById(partOf.target).position()
      : { x: cy.width() / 2, y: cy.height() / 2 };
    return { x: anchor.x + (Math.random() - 0.5) * 160, y: anchor.y + 60 + (Math.random() - 0.5) * 80 };
  }

  // Local render of model-proposed ops. The server is the authority (and the
  // only stamper of timestamps) — the caller forwards these same ops to
  // /api/ops; the position this client chose rides along on the op.
  function applyOps(ops) {
    for (const o of ops) {
      try {
        if (o.op === "add_node" && o.id && !cy.getElementById(o.id).length) {
          const pos = placeNear(o.id, ops);
          o.x = pos.x; o.y = pos.y;
          cy.add({ group: "nodes",
            data: { id: o.id, label: o.label || o.id, type: o.type || "task", mode: o.mode || "step",
                    minutes: o.minutes, when: o.when, detail: o.detail, status: o.status || "open" },
            position: pos });
        } else if (o.op === "update_node") {
          const n = cy.getElementById(o.id);
          if (n.length) {
            ["label","type","mode","minutes","when","detail","status"].forEach((k) => {
              if (o[k] !== undefined && o[k] !== null) n.data(k, o[k]);
            });
            if (o.status === "open") n.removeData("doneAt");
          }
        } else if (o.op === "remove_node") {
          cy.getElementById(o.id).remove();
        } else if (o.op === "add_edge" && cy.getElementById(o.source).length && cy.getElementById(o.target).length) {
          const eid = o.source + "->" + o.target + ":" + (o.kind || "part_of");
          if (!cy.getElementById(eid).length)
            cy.add({ group: "edges", data: { id: eid, source: o.source, target: o.target, kind: o.kind || "part_of" } });
        } else if (o.op === "remove_edge") {
          cy.edges().filter((e) => e.data("source") === o.source && e.data("target") === o.target).remove();
        }
      } catch (e) { console.warn("op failed", o, e); }
    }
  }

  // ---- talking to the server ----
  async function send(text) {
    addMsg("user", text);
    messages.push({ role: "user", content: text });
    setBusy(true);
    try {
      const res = await fetch("/api/graph-step", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || "Something went wrong.");
      messages.push({ role: "assistant", content: out.reply });
      addMsg("ai", out.reply);
      applyOps(out.operations || []);
      Unstuck.sendOps(out.operations || []);
    } catch (err) {
      messages.pop();
      addMsg("err", err.message);
    } finally {
      setBusy(false);
      save();
    }
  }

  // ---- node selection box ----
  function showNodeBox(n) {
    selected = n;
    $("node-title").value = n.data("label") || "";
    $("node-detail").value = n.data("detail") || "";
    $("node-when").value = n.data("when") || "";
    $("node-minutes").value = n.data("minutes") ?? "";
    $("node-type").value = n.data("type") || "task";
    $("node-mode").value = n.data("mode") || "step";
    $("toggle-done").textContent = n.data("status") === "done" ? "Reopen" : "Done";
    $("node-box").classList.add("show");
  }
  function hideNodeBox() { selected = null; $("node-box").classList.remove("show"); }

  cy.on("tap", "node", (e) => showNodeBox(e.target));
  cy.on("tap", (e) => { if (e.target === cy) hideNodeBox(); });
  cy.on("dragfree", "node", (e) => Unstuck.sendOps([{ op: "move_node", id: e.target.id(),
    x: e.target.position().x, y: e.target.position().y }]));

  // ---- buttons ----
  $("send").addEventListener("click", () => {
    const t = $("input").value.trim();
    if (t && !busy) { $("input").value = ""; send(t); }
  });
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("send").click();
  });

  $("split").addEventListener("click", () => {
    if (selected && !busy)
      send("Split \"" + selected.data("label") + "\" (id: " + selected.id() + ") smaller — it's still too big.");
  });
  // every node field is editable; an edit applies locally for instant UI and
  // goes to the server as an update_node op (null = clear the field)
  function fieldOp(key, v) {
    if (!selected) return;
    if (v === null) selected.removeData(key); else selected.data(key, v);
    Unstuck.sendOps([{ op: "update_node", id: selected.id(), [key]: v }]);
    showNodeBox(selected);
  }
  $("node-title").addEventListener("change", () => {
    const v = $("node-title").value.trim();
    if (v) fieldOp("label", v); else showNodeBox(selected); // never blank a title
  });
  $("node-detail").addEventListener("change", () => fieldOp("detail", $("node-detail").value.trim() || null));
  $("node-when").addEventListener("change", () => fieldOp("when", $("node-when").value || null));
  $("node-minutes").addEventListener("change", () => {
    const m = parseInt($("node-minutes").value, 10);
    fieldOp("minutes", m > 0 ? m : null);
  });
  $("node-type").addEventListener("change", () => fieldOp("type", $("node-type").value));
  $("node-mode").addEventListener("change", () => fieldOp("mode", $("node-mode").value));

  $("toggle-done").addEventListener("click", () => {
    if (!selected) return;
    const status = selected.data("status") === "done" ? "open" : "done";
    selected.data("status", status);
    if (status === "open") selected.removeData("doneAt");
    Unstuck.sendOps([{ op: "update_node", id: selected.id(), status }]);
    showNodeBox(selected);
  });
  $("delete").addEventListener("click", () => {
    if (!selected) return;
    const id = selected.id();
    selected.remove(); hideNodeBox();
    Unstuck.sendOps([{ op: "remove_node", id }]);
  });

  $("add-node").addEventListener("click", () => {
    const v = prompt("Label for the new node:");
    if (!v) return;
    const id = "me-" + Date.now().toString(36);
    const pos = { x: cy.width() / 2, y: cy.height() / 2 };
    cy.add({ group: "nodes",
      data: { id, label: v.trim(), type: "task", mode: "step", status: "open" },
      position: pos });
    Unstuck.sendOps([{ op: "add_node", id, label: v.trim(), type: "task", mode: "step",
                       x: pos.x, y: pos.y }]);
  });

  // cose tuned so titles get room: node boxes include the label bounds and
  // edges aim longer than a wrapped label is wide (text-max-width 110)
  function runLayout(onSettled) {
    if (!cy.nodes().length) return;
    cy.layout({
      name: "cose", animate: true, padding: 60,
      nodeDimensionsIncludeLabels: true,
      idealEdgeLength: () => 130,
      componentSpacing: 100,
    }).run();
    // once the animation settles, persist the new arrangement
    setTimeout(onSettled || (() => Unstuck.sendOps(cy.nodes().map((n) => ({
      op: "move_node", id: n.id(), x: n.position().x, y: n.position().y })))), 1600);
  }

  $("arrange").addEventListener("click", runLayout);

  $("sample").addEventListener("change", async (e) => {
    const which = e.target.value;
    e.target.value = "";
    if (!which) return;
    if (cy.nodes().length && !confirm("Replace the current map with this sample?")) return;
    try {
      const res = await fetch("/samples/" + which + ".json");
      if (!res.ok) throw new Error("Sample not found — run scripts/generate-samples.mjs first.");
      const sample = await res.json();
      cy.elements().remove();
      messages = []; save();
      hideNodeBox();
      cy.add(sample.graph.nodes.map((n) => ({ group: "nodes", data: { status: "open", ...n } })));
      cy.add(sample.graph.edges.map((ed) => ({ group: "edges",
        data: { id: ed.source + "->" + ed.target + ":" + ed.kind, ...ed } })));
      // once the layout settles, replace the server graph wholesale
      runLayout(() => Unstuck.replaceGraph(cy.elements().jsons()));
      $("chat").innerHTML = "";
      addMsg("ai", "Loaded the “" + sample.name + "” sample map. Drag things around, mark steps done, or keep talking — I can see the map as it is now.");
    } catch (err) {
      addMsg("err", err.message);
    }
  });

  Unstuck.onThemeChange(() => cy.style().update());

  $("clear").addEventListener("click", () => {
    if (confirm("Clear the whole map and conversation?")) {
      cy.elements().remove(); messages = []; hideNodeBox(); save();
      Unstuck.replaceGraph([]);
      $("chat").innerHTML = "";
      addMsg("ai", "Fresh map. Dump something you keep avoiding.");
    }
  });
</script>
</body>
</html>
