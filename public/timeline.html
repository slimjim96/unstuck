<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstuck — Timeline</title>
<style>
  :root {
    --bg: #10141a; --ink: #e8ecf1; --muted: #8b97a5;
    --accent: #4fc3a1; --time: #d9a05b; --mixed: #9d8cff; --stuck: #d97b7b;
    --line: #2a3442;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  #timeline { position: absolute; inset: 0; width: 100%; height: 100%; }
  #topbar {
    position: absolute; top: 14px; left: 16px; z-index: 5;
    display: flex; align-items: center; gap: 14px;
  }
  #topbar h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  #topbar a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  #topbar a:hover { color: var(--accent); }
  #hint {
    position: absolute; bottom: 14px; left: 16px; z-index: 5;
    color: var(--muted); font-size: 0.78rem;
  }
  #empty {
    position: absolute; inset: 0; z-index: 4;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; text-align: center;
  }
  #empty.show { display: flex; }
  #empty a { color: var(--accent); }
</style>
</head>
<body>
<svg id="timeline"></svg>

<div id="topbar">
  <h1>Unstuck — Timeline</h1>
  <a href="/">← Map (editing)</a>
  <a href="/space.html">Space (3D)</a>
  <a href="/focus.html">Focus mode</a>
</div>

<div id="empty">
  <div id="empty-msg">Nothing here yet.</div>
  <div><a href="/">Build your map first</a> — this is a viewing lens on the same graph.</div>
</div>

<p id="hint">dated things land on the axis · edits happen on the Map</p>

<script>
  const MODE_COLOR = { step: "#4fc3a1", time: "#d9a05b", mixed: "#9d8cff" };
  const DAY = 86400000;
  const sampleParam = new URLSearchParams(location.search).get("sample");
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("timeline");

  function el(name, attrs, text) {
    const e = document.createElementNS(svgNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Parse "YYYY-MM-DD" as a *local* date (Date.parse would read it as UTC,
  // which shifts the day west of Greenwich). Anything unparseable → null.
  function parseWhen(when) {
    if (!when) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(when);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]).getTime();
    const t = Date.parse(when);
    return Number.isNaN(t) ? null : new Date(t).setHours(0, 0, 0, 0);
  }

  // Same-origin localStorage: the Map page saves cy.elements().jsons() here.
  function loadLocal() {
    const elements = JSON.parse(localStorage.getItem("unstuck.graph") || "[]");
    const nodes = [];
    for (const elem of elements) {
      const d = elem.data || {};
      if (!d.source && d.id)
        nodes.push({ id: d.id, label: d.label || d.id, type: d.type, mode: d.mode,
                     minutes: d.minutes, when: d.when, detail: d.detail, status: d.status || "open" });
    }
    return { nodes };
  }

  async function loadData() {
    if (sampleParam) {
      const res = await fetch("/samples/" + sampleParam + ".json");
      if (res.ok) {
        const sample = await res.json();
        return { nodes: sample.graph.nodes };
      }
    }
    return loadLocal();
  }

  function nodeColor(n) {
    if (n.status === "done") return "#3a4756";
    if (n.type === "stuck") return "#d97b7b";
    return MODE_COLOR[n.mode] || "#5a6b7d";
  }

  const fmtDay = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

  function ticks(t0, t1) {
    const span = (t1 - t0) / DAY;
    const out = [];
    const d = new Date(t0);
    d.setHours(0, 0, 0, 0);
    if (span <= 21) {
      if (+d < t0) d.setDate(d.getDate() + 1);
      while (+d <= t1) { out.push({ t: +d, label: fmtDay(d) }); d.setDate(d.getDate() + 1); }
    } else if (span <= 130) {
      d.setDate(d.getDate() + ((8 - d.getDay()) % 7)); // next Monday
      while (+d <= t1) { out.push({ t: +d, label: fmtDay(d) }); d.setDate(d.getDate() + 7); }
    } else {
      d.setDate(1);
      if (+d < t0) d.setMonth(d.getMonth() + 1);
      while (+d <= t1) {
        out.push({ t: +d, label: d.toLocaleDateString(undefined,
          d.getMonth() === 0 ? { month: "short", year: "numeric" } : { month: "short" }) });
        d.setMonth(d.getMonth() + 1);
      }
    }
    return out;
  }

  function setEmpty(allNodes, dated) {
    const show = dated.length === 0;
    document.getElementById("empty").classList.toggle("show", show);
    if (show) document.getElementById("empty-msg").textContent = allNodes.length
      ? "Nothing on the map has a date yet — when something gets a “when”, it lands here."
      : "Nothing here yet.";
  }

  let data = { nodes: [] };

  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const W = svg.clientWidth, H = svg.clientHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    const today = new Date().setHours(0, 0, 0, 0);
    const items = data.nodes
      .map((n) => ({ ...n, t: parseWhen(n.when) }))
      .filter((n) => n.t !== null)
      .sort((a, b) => a.t - b.t);

    setEmpty(data.nodes, items);
    document.getElementById("hint").textContent =
      "dated things land on the axis · " +
      (data.nodes.length - items.length) + " undated stay on the Map · edits happen on the Map";
    if (!items.length) return;

    let t0 = Math.min(items[0].t, today), t1 = Math.max(items[items.length - 1].t, today);
    const pad = Math.max((t1 - t0) * 0.08, 3 * DAY);
    t0 -= pad; t1 += pad;
    const mx = 60;
    const X = (t) => mx + ((t - t0) / (t1 - t0)) * (W - 2 * mx);
    const axisY = H * 0.52;

    // axis + ticks
    svg.appendChild(el("line", { x1: mx, y1: axisY, x2: W - mx, y2: axisY,
      stroke: "#3a4756", "stroke-width": 1.5 }));
    for (const tk of ticks(t0, t1)) {
      const x = X(tk.t);
      svg.appendChild(el("line", { x1: x, y1: axisY - 4, x2: x, y2: axisY + 4, stroke: "#3a4756" }));
      svg.appendChild(el("text", { x, y: axisY + 20, fill: "#8b97a5", "font-size": 10.5,
        "text-anchor": "middle" }, tk.label));
    }

    // today marker
    const tx = X(today);
    svg.appendChild(el("line", { x1: tx, y1: H * 0.16, x2: tx, y2: H * 0.88,
      stroke: "#4fc3a1", "stroke-width": 1, "stroke-dasharray": "4 5", opacity: 0.55 }));
    svg.appendChild(el("text", { x: tx, y: H * 0.16 - 8, fill: "#4fc3a1", "font-size": 11,
      "text-anchor": "middle" }, "today"));

    // place items: alternate above/below the axis, bump to the next level
    // when labels would overlap horizontally
    const lanes = { up: [], down: [] };
    let flip = false;
    for (const it of items) {
      const x = X(it.t);
      it._label = (it.status === "done" ? "✓ " : "") +
        (it.label.length > 34 ? it.label.slice(0, 33) + "…" : it.label);
      const meta = [fmtDay(new Date(it.t))];
      if (it.minutes) meta.push("~" + it.minutes + " min");
      if (it.status === "done") meta.push("done");
      else if (it.t < today) meta.push("overdue");
      it._meta = meta.join(" · ");
      it._overdue = it.status !== "done" && it.t < today;
      const w = Math.max(it._label.length, it._meta.length) * 6 + 12;
      const side = flip ? "down" : "up"; flip = !flip;
      let lvl = 0;
      while (lanes[side][lvl] !== undefined && x - w / 2 < lanes[side][lvl] + 14) lvl++;
      lanes[side][lvl] = x + w / 2;
      it._x = x; it._side = side; it._lvl = lvl;
    }

    for (const it of items) {
      const big = it.type === "stuck" || it.type === "task";
      const off = 58 + it._lvl * 52;
      const yDot = it._side === "up" ? axisY - off : axisY + off;
      const g = el("g", { opacity: it.status === "done" ? 0.55 : 1 });
      g.appendChild(el("line", { x1: it._x, y1: axisY, x2: it._x, y2: yDot,
        stroke: "#2a3442", "stroke-width": 1 }));
      const dot = el("circle", { cx: it._x, cy: yDot, r: big ? 8 : 5.5, fill: nodeColor(it) });
      if (it._overdue) { dot.setAttribute("stroke", "#d97b7b"); dot.setAttribute("stroke-width", 2); }
      const tip = [it.label, it._meta, it.detail].filter(Boolean).join("\n");
      dot.appendChild(el("title", {}, tip));
      g.appendChild(dot);
      g.appendChild(el("text", { x: it._x, y: yDot + (big ? 24 : 21), "text-anchor": "middle",
        fill: it.status === "done" ? "#8b97a5" : "#e8ecf1", "font-size": 11.5 }, it._label));
      g.appendChild(el("text", { x: it._x, y: yDot + (big ? 39 : 36), "text-anchor": "middle",
        fill: it._overdue ? "#d97b7b" : "#8b97a5", "font-size": 10 }, it._meta));
      svg.appendChild(g);
    }
  }

  loadData().then((d) => { data = d; render(); });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });

  // Live-sync (localStorage mode only): the storage event fires when the
  // Map, open in another tab, saves.
  if (!sampleParam) {
    window.addEventListener("storage", (e) => {
      if (e.key === "unstuck.graph") { data = loadLocal(); render(); }
    });
  }
</script>
</body>
</html>
