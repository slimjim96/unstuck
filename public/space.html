<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstuck — Space</title>
<script>if (localStorage.getItem("unstuck.theme") === "light") document.documentElement.classList.add("light");</script>
<!-- ESM + import map so 3d-force-graph and three-spritetext share ONE three
     instance (the UMD builds don't: spritetext binds to a global THREE that
     the 3d-force-graph bundle never exposes, which blanks the scene). -->
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.180.0",
    "three/": "https://esm.sh/three@0.180.0/"
  }
}
</script>
<style>
  :root {
    --bg: #10141a; --ink: #e8ecf1; --muted: #8b97a5;
    --accent: #4fc3a1; --time: #d9a05b; --mixed: #9d8cff; --stuck: #d97b7b;
    --btn: #2a3442;
    color-scheme: dark;
  }
  html.light {
    --bg: #eef2f5; --ink: #1c2733; --muted: #5f6e7d;
    --accent: #1f9d7e; --time: #b87b2e; --mixed: #7263d2; --stuck: #c45c5c;
    --btn: #d4dde4;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  #graph { position: absolute; inset: 0; }
  #topbar {
    position: absolute; top: 14px; left: 16px; z-index: 5;
    display: flex; align-items: center; gap: 14px;
  }
  #topbar h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  #topbar a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  #topbar a:hover { color: var(--accent); }
  #topbar button {
    font: inherit; font-size: 0.8rem; border: 0; border-radius: 8px;
    padding: 5px 12px; cursor: pointer; background: var(--btn); color: var(--ink);
  }
  #hint {
    position: absolute; bottom: 14px; left: 16px; z-index: 5;
    color: var(--muted); font-size: 0.78rem;
  }
  #empty {
    position: absolute; inset: 0; z-index: 4;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; text-align: center;
  }
  #empty.show { display: flex; }
  #empty a { color: var(--accent); }
</style>
</head>
<body>
<div id="graph"></div>

<div id="topbar">
  <h1>Unstuck — Space</h1>
  <a href="/">← Map (editing)</a>
  <a href="/timeline.html">Timeline</a>
  <a href="/trail.html">Trail</a>
  <a href="/focus.html">Focus mode</a>
  <button id="layout-mode">Tree layout</button>
  <button id="theme">Light</button>
</div>

<div id="empty">
  <div>Nothing here yet.</div>
  <div><a href="/">Build your map first</a> — this is a viewing lens on the same graph.</div>
</div>

<p id="hint">drag to orbit · scroll to zoom · click a node to fly to it · edits happen on the Map</p>

<script type="module">
  import ForceGraph3D from "https://esm.sh/3d-force-graph@1.79.0?external=three";
  import SpriteText from "https://esm.sh/three-spritetext@1.10.0?external=three";

  // WebGL colors are set via accessors, so light mode needs a palette swap +
  // re-setting the accessors (fresh closures force a repaint)
  const PALETTES = {
    dark: { bg: "#10141a", step: "#4fc3a1", time: "#d9a05b", mixed: "#9d8cff",
            stuck: "#d97b7b", plain: "#5a6b7d", done: "#3a4756", label: "#e8ecf1",
            labelDone: "#5a6b7d", related: "#2f3a48", edge: "#3a4756" },
    light: { bg: "#eef2f5", step: "#1f9d7e", time: "#b87b2e", mixed: "#7263d2",
             stuck: "#c45c5c", plain: "#8595a5", done: "#c2ccd6", label: "#1c2733",
             labelDone: "#8595a5", related: "#cdd8e0", edge: "#aab6c2" },
  };
  let theme = localStorage.getItem("unstuck.theme") || "dark";
  const P = () => PALETTES[theme];
  const sampleParam = new URLSearchParams(location.search).get("sample");

  function toData(nodes, edges) {
    const ids = new Set(nodes.map((n) => n.id));
    return {
      nodes,
      // 3d-force-graph throws on dangling links — drop them defensively
      links: edges.filter((l) => ids.has(l.source) && ids.has(l.target)),
    };
  }

  // Same-origin localStorage: the Map page saves cy.elements().jsons() here.
  function loadLocal() {
    const elements = JSON.parse(localStorage.getItem("unstuck.graph") || "[]");
    const nodes = [], edges = [];
    for (const el of elements) {
      const d = el.data || {};
      if (d.source && d.target) {
        edges.push({ source: d.source, target: d.target, kind: d.kind || "part_of" });
      } else if (d.id) {
        nodes.push({ id: d.id, label: d.label || d.id, type: d.type, mode: d.mode,
                     minutes: d.minutes, when: d.when, detail: d.detail, status: d.status || "open" });
      }
    }
    return toData(nodes, edges);
  }

  async function loadData() {
    if (sampleParam) {
      const res = await fetch("/samples/" + sampleParam + ".json");
      if (res.ok) {
        const sample = await res.json();
        return toData(sample.graph.nodes, sample.graph.edges);
      }
    }
    return loadLocal();
  }

  function nodeColor(n) {
    if (n.status === "done") return P().done;
    if (n.type === "stuck") return P().stuck;
    return P()[n.mode] || P().plain;
  }

  function makeLabel(n) {
    const big = n.type === "stuck" || n.type === "task";
    const sprite = new SpriteText(n.status === "done" ? "✓ " + n.label : n.label);
    sprite.color = n.status === "done" ? P().labelDone : P().label;
    sprite.textHeight = big ? 4 : 2.6;
    // sit fully below the sphere (radius ~ nodeRelSize·∛val ≈ 7.3 for big
    // nodes) and skip depth testing so the title is never hidden behind
    // its own sphere or other geometry
    sprite.position.y = big ? -11 : -7;
    sprite.material.depthTest = false;
    sprite.material.depthWrite = false;
    sprite.renderOrder = 2;
    return sprite;
  }

  function linkColor(l) {
    return l.kind === "blocks" ? P().time : l.kind === "related" ? P().related : P().edge;
  }

  function nodeTooltip(n) {
    const bits = [n.label];
    const meta = [];
    if (n.type) meta.push(n.type);
    if (n.mode) meta.push(n.mode + "-based");
    if (n.minutes) meta.push("~" + n.minutes + " min");
    if (n.when) meta.push(n.when);
    if (n.status === "done") meta.push("done ✓");
    if (meta.length) bits.push("<span style='color:#8b97a5'>" + meta.join(" · ") + "</span>");
    if (n.detail) bits.push("<span style='color:#8b97a5'>" + n.detail + "</span>");
    return bits.join("<br>");
  }

  const data = await loadData();
  document.getElementById("empty").classList.toggle("show", data.nodes.length === 0);

  const Graph = ForceGraph3D()(document.getElementById("graph"))
    .backgroundColor(P().bg)
    .graphData(data)
    .nodeLabel(nodeTooltip)
    .nodeColor((n) => nodeColor(n))
    .nodeVal((n) => (n.type === "stuck" || n.type === "task" ? 6 : 2))
    .nodeOpacity(0.92)
    // visible labels: text sprite rendered alongside the sphere
    .nodeThreeObject((n) => makeLabel(n))
    .nodeThreeObjectExtend(true)
    .onDagError(() => {}) // tolerate cycles from 'related'/'blocks' edges in tree mode
    .linkColor((l) => linkColor(l))
    .linkWidth((l) => (l.kind === "blocks" ? 1.5 : 0.8))
    .linkDirectionalArrowLength((l) => (l.kind === "blocks" ? 4 : 0))
    .linkDirectionalArrowRelPos(0.9)
    .linkOpacity(0.5)
    .onNodeClick((node) => {
      // fly the camera to the node
      const dist = 90;
      const ratio = 1 + dist / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
      Graph.cameraPosition(
        { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
        node, 900);
    });

  function setTheme(t) {
    theme = t;
    localStorage.setItem("unstuck.theme", t);
    document.documentElement.classList.toggle("light", t === "light");
    document.getElementById("theme").textContent = t === "light" ? "Dark" : "Light";
    // fresh closures so the kapsule props register a change and repaint
    Graph.backgroundColor(P().bg)
      .nodeColor((n) => nodeColor(n))
      .nodeThreeObject((n) => makeLabel(n))
      .linkColor((l) => linkColor(l));
  }
  document.getElementById("theme").textContent = theme === "light" ? "Dark" : "Light";
  document.getElementById("theme").addEventListener("click",
    () => setTheme(theme === "light" ? "dark" : "light"));
  window.addEventListener("storage", (e) => {
    if (e.key === "unstuck.theme" && e.newValue && e.newValue !== theme) setTheme(e.newValue);
  });

  // Tree layout: arrange the part_of hierarchy top-down; toggle back to free.
  let treeMode = false;
  document.getElementById("layout-mode").addEventListener("click", (e) => {
    treeMode = !treeMode;
    Graph.dagMode(treeMode ? "td" : null).dagLevelDistance(45);
    e.target.textContent = treeMode ? "Free layout" : "Tree layout";
  });

  // Live-sync (localStorage mode only): the storage event fires when the
  // Map, open in another tab, saves.
  if (!sampleParam) {
    window.addEventListener("storage", (e) => {
      if (e.key === "unstuck.graph") {
        const fresh = loadLocal();
        document.getElementById("empty").classList.toggle("show", fresh.nodes.length === 0);
        Graph.graphData(fresh);
      }
    });
  }
</script>
</body>
</html>
